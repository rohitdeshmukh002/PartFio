<section class="testimonials-section">
  <h4 class="subtitle">WHAT PEOPLE ARE SAYING</h4>
  <h1 class="main-title">App Testimonials</h1>

  <!-- Testimonials Slider -->
  <div class="testimonials-container">
    <div
      class="testimonial"
      *ngFor="let testimonial of testimonials; let i = index"
      [class.active]="i === activeIndex">
      
      <div class="testimonial-text">
        <h3 class="company-name">{{ testimonial.company }}</h3>
        <p class="testimonial-quote">"{{ testimonial.quote }}"</p>
        <span class="owner-label">{{ testimonial.ownerLabel }}</span>
        <span class="owner-name">{{ testimonial.owner }}</span>
      </div>
      <div class="testimonial-image">
        <div class="profile-image">
          <img [src]="testimonial.profileImage" [alt]="testimonial.owner" />
        </div>
      </div>
    </div>
  </div>

  <!-- Testimonials Pagination -->
  <div class="pagination">
    <span
      *ngFor="let testimonial of testimonials; let i = index"
      class="dot"
      [class.active]="i === activeIndex"
      (click)="setActiveIndex(i)"
    ></span>
  </div>

  <!-- Image Carousel -->
  <div class="carousel-container">
    <div class="carousel">
      <div class="carousel-item" *ngFor="let image of currentImages">
        <img [src]="image.src" [alt]="image.alt" />
      </div>
    </div>

    <!-- Carousel Pagination -->
    <div class="carousel-pagination">
      <span
        *ngFor="let page of totalPages; let i = index"
        class="dot"
        [class.active]="i === currentPageIndex"
        (click)="setImagePage(i)"
      ></span>
    </div>
  </div>
</section>
